<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Price Drop Tracker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-icon">📉</span>
      <h1>Price Drop Tracker</h1>
    </div>
    <div class="header-actions">
      <button id="settingsBtn" title="Notification settings">⚙</button>
      <button id="checkNowBtn" title="Check all prices now">
        <span class="refresh-icon">↻</span>
      </button>
    </div>
  </header>

  <div id="currentPageBanner" class="page-banner hidden">
    <span class="page-banner-icon"></span>
    <div class="page-banner-text">
      <strong id="pageBannerTitle"></strong>
      <span id="pageBannerSubtitle"></span>
    </div>
    <button id="pageBannerTrackBtn" class="page-banner-btn">Track this page</button>
  </div>

  <div id="settingsPanel" class="settings-panel hidden">
    <label class="settings-row">
      <input type="checkbox" id="notifEnabled" />
      Notify me on price drops
    </label>
    <label class="settings-row">
      Minimum drop to notify
      <select id="minDropPercent">
        <option value="0">Any drop</option>
        <option value="1">1% or more</option>
        <option value="3">3% or more</option>
        <option value="5">5% or more</option>
        <option value="10">10% or more</option>
      </select>
    </label>
    <p class="settings-note">Drops are always recorded either way — this only controls the pop-up.</p>
  </div>

  <div id="runSummary" class="run-summary">
    <span id="runDot" class="run-dot"></span>
    <span id="runSummaryText">Not checked yet</span>
  </div>

  <div class="add-mode-toggle">
    <button id="modeUrlBtn" class="mode-btn active">Paste link</button>
    <button id="modeSearchBtn" class="mode-btn">Search by description</button>
  </div>

  <form id="addForm">
    <input type="url" id="urlInput" placeholder="Paste a product link…" required />
    <button type="submit">Track</button>
  </form>

  <form id="searchForm" class="hidden">
    <input type="text" id="descInput" placeholder="e.g. Sony WH-1000XM5 headphones" required />
    <button type="submit">Search</button>
  </form>

  <p id="statusMsg"></p>

  <ul id="searchResultsList" class="search-results hidden"></ul>

  <template id="searchResultTemplate">
    <li class="search-result">
      <div class="sr-main">
        <span class="sr-retailer"></span>
        <a class="sr-title" target="_blank" rel="noopener"></a>
      </div>
      <div class="sr-side">
        <span class="sr-price"></span>
        <button class="sr-track-btn">Track</button>
      </div>
    </li>
  </template>

  <details id="recentDropsSection" class="recent-drops hidden">
    <summary>Recent drops</summary>
    <ul id="recentDropsList"></ul>
  </details>

  <ul id="productList"></ul>

  <template id="productTemplate">
    <li class="product">
      <div class="product-main">
        <a class="product-title" target="_blank" rel="noopener"></a>
        <button class="remove-btn" title="Stop tracking">✕</button>
      </div>
      <div class="product-prices">
        <span class="current-price"></span>
        <span class="price-badge"></span>
        <span class="lowest-price"></span>
      </div>
      <div class="sparkline-wrap"></div>
      <div class="product-context"></div>
      <div class="product-meta"></div>
    </li>
  </template>

  <div id="toast" class="toast hidden">
    <span id="toastText"></span>
    <button id="toastUndoBtn" class="toast-undo">Undo</button>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
